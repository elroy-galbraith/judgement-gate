# Org judgement config. Put this at .github/judgement-gate.yml in your organisation's `.github` repo
# and protect it with CODEOWNERS: whoever owns this file owns the org's judgement.
# It is always read from the default branch, so a PR cannot change the rules that gate it.
#
# Note: a non-empty list REPLACES the default. List `use: one-way-door` to keep it running.
judgements:
  # Built-in: is this a one-way door? Optional overrides: confidence_threshold, applies_to, probes.
  - use: one-way-door
    confidence_threshold: 0.75
    # probes:                            # optional: replace the built-in questions shown to the author
    #   type1: ["Who else reads this table, and how do you know?"]
    #   type2: ["What signal tells you to roll back, and who watches it?"]

  # Declarative: one yes/no question for the model, a threshold, and how an author clears it.
  - id: public-api-contract
    name: Public API contract change
    question: "Does this change break or remove a public API contract?"
    true: "removes/renames endpoints, fields or exported symbols"
    false: "additive or internal only"
    threshold: 0.6                       # flagged when P(true) >= threshold
    applies_to: ["services/api/**"]      # only judged when a changed file matches
    satisfied_by:                        # required; any one entry clears the flag
      - pr_body_matches: "(?i)^Migration Plan:"
      - file_added: "docs/api-changes/*.md"
      # Stricter: the model must judge that the PR description gives a concrete answer, so "n/a" does not clear it.
      # List `answers` alone to require it; next to a regex or file rule, that rule still clears on its own.
      # - answers: "What is the migration path for existing consumers?"
    why: "Consumers cannot roll back with us. Breaking changes need a migration plan."
    fix: "Add a 'Migration Plan:' line to the PR description, or a new note under docs/api-changes/."
    probes:                              # optional: up to 7 short questions a reviewer will ask
      - "Which consumers call the changed endpoint or field, and how do you know?"
      - "What do they see during the rollout window, with old and new versions side by side?"

  # Classifier: labels the PR with a level you define, and never fails the check. Order the levels most
  # severe first. There is no built-in rubric: what P0 means is for your org to write.
  - id: severity
    name: Severity
    classify:
      question: "If this change is wrong, how bad is the impact?"
      levels:
        - id: P0
          means: "customer-facing outage, data loss, or security exposure"
        - id: P1
          means: "major feature broken for many users, no workaround"
        - id: P2
          means: "degraded or partial; a workaround exists"
        - id: P3
          means: "internal or cosmetic; no customer impact"
    applies_to: ["services/**"]          # optional; omit to classify every PR

# Optional. Who should review: a person or an agent. The gate only recommends: it adds a PR label and
# never changes the check result. Enforce it with CODEOWNERS or a workflow (docs/configuration.md).
# Without this block the defaults below still apply. The `routing:` block is read from the default
# branch like the rest of this file.
routing:
  label: needs-human-review     # added to the PR (never removed) when a human should review. Max 50 chars.
  include_defaults: true        # keep the built-in rules: one-way-door fired, one-way-door reason ambiguous
  human_when:                   # any matching entry routes to a human
    - judgement: public-api-contract   # that judgement fired, even if the author cleared it
    - judgement: one-way-door
      reason: ambiguous                # that judgement returned this reason code (already a default)
    - files: ["migrations/**", "infra/**"]   # any changed file matches, even a deleted one
